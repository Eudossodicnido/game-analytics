name: terraform-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: |
          git diff --name-only HEAD^1 HEAD
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(terraform/|\.github/workflows/terraform-ci\.yml$)'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.changes.outputs.terraform == 'true'
        with:
          terraform_version: 1.16.3
      - if: steps.changes.outputs.terraform == 'true'
        run: terraform -chdir=terraform fmt -check -recursive
      - if: steps.changes.outputs.terraform == 'true'
        run: terraform -chdir=terraform init -backend=false
      - if: steps.changes.outputs.terraform == 'true'
        run: terraform -chdir=terraform validate
        