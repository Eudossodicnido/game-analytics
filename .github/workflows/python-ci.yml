name: python-ci

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/python-ci.yml"
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==2.4.1
      - run: poetry install --only dev --no-root
      - run: poetry run ruff check src/
      