[tool.poetry]
name = "game-analytics"
version = "0.1.0"
description = ""
authors = ["Luca Costantino <69009356+Eudossodicnido@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "src"}] 

[tool.poetry.dependencies]
python = ">=3.12,<3.15" 
duckdb = ">=1.0.0" 
python-dotenv = "^1.2.2" 

[tool.poetry.group.dashboard]
optional=false

[tool.poetry.group.dashboard.dependencies]
streamlit = "^1.51.0" 
pandas = "^3.0.5"
plotly = "^6.5.2" 

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.14"  
dagster-webserver = "^1.13.15"  
dagster-dg-cli = "^1.13.15" 
ipykernel = "^7.3.0"

[tool.poetry.group.pipeline]
optional = true

[tool.poetry.group.pipeline.dependencies]
requests = "^2.32.5" 
dbt-duckdb = "^1.10.0" 
boto3 = "^1.43.17" 
tenacity = "^9.1.4" 
dagster = "^1.13.15" 
python-dateutil = "^2.9.0.post0" 

[tool.dagster]
module_name = "src.orchestration.definitions"
code_location_name = "game_analytics"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
